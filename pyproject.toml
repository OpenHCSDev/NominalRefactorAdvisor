[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "nominal-refactor-advisor"
version = "0.1.0"
description = "AST-driven advisor for canonical nominal refactoring patterns"
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "OpenHCSDev" }]
dependencies = [
    "metaclass-registry>=0.1.4",
    "tree-sitter>=0.25,<0.26",
    "tree-sitter-python>=0.25,<0.26",
]

[project.scripts]
nominal-refactor-advisor = "nominal_refactor_advisor.cli:process_main"
nominal-refactor-benchmark = "nominal_refactor_advisor.benchmark:process_main"

[project.optional-dependencies]
dev = [
    "black>=26.3",
    "build>=1.2",
    "coverage[toml]>=7",
    "pytest>=8",
    "pytest-cov>=5",
    "pytest-xdist>=3.8",
    "Sphinx>=8.0",
]
docs = [
    "Sphinx>=8.0",
]

[tool.black]
line-length = 88
target-version = ["py311"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = ["-n", "auto", "--maxprocesses=8", "--dist=worksteal"]
