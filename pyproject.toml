[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "nominal-refactor-advisor"
version = "0.1.0"
description = "AST-driven advisor for canonical nominal refactoring patterns"
readme = "README.md"
requires-python = ">=3.12"
authors = [{ name = "OpenHCSDev" }]
dependencies = [
    "metaclass-registry @ git+https://github.com/OpenHCSDev/metaclass-registry@main",
    "tree-sitter>=0.26",
    "tree-sitter-python>=0.25",
    "typing_extensions",
]

[project.scripts]
nominal-refactor-advisor = "nominal_refactor_advisor.cli:process_main"
nominal-refactor-benchmark = "nominal_refactor_advisor.benchmark:process_main"
nra-census = "nominal_refactor_advisor.audit.census_cli:main"
nra-overlay = "nominal_refactor_advisor.audit.overlay:main"
nra-check-package = "nominal_refactor_advisor.audit.check_package:main"
nra-merge-review = "nominal_refactor_advisor.audit.merge_review:main"
nra-attribute-origin = "nominal_refactor_advisor.audit.attribute_origin:main"

[project.optional-dependencies]
dev = [
    "black>=26.3",
    "build>=1.2",
    "coverage[toml]>=7",
    "mypy>=1.18",
    "pytest>=8",
    "pytest-cov>=5",
    "pytest-xdist>=3.8",
    "ruff>=0.6",
    "Sphinx>=8.0",
]
docs = [
    "Sphinx>=8.0",
]
types = [
    "mypy>=1.10",
]

[tool.setuptools]
# The trace plugin runs in the traced project's environment: stdlib and pytest only.
py-modules = ["nra_introspection_trace"]

[tool.setuptools.packages.find]
include = ["nominal_refactor_advisor*"]

[tool.setuptools.package-data]
nominal_refactor_advisor = ["py.typed"]
"nominal_refactor_advisor.audit" = ["patterns/*.md"]

[tool.black]
line-length = 88
target-version = ["py312"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = ["-n", "auto", "--maxprocesses=8", "--dist=worksteal"]

[tool.nominal-refactor-advisor.family-root]
root = "nominal_refactor_advisor.case_root:Case"
value = "value"
decoder = "of"
